# NEON STRIKE — deploy to Cloudflare Pages (roadmap item 53).
#
# This is the whole deploy pipeline (it replaced Netlify's netlify.toml, deleted in
# the same roadmap item). The project is a Cloudflare Pages DIRECT UPLOAD project,
# deliberately NOT connected to this repo
# in the Cloudflare dashboard: that choice is a one-way door (a git-integrated
# project can never be converted to direct upload, or back), and it is what keeps
# the build command, the tag fetch and the docs-only deploy skip in version
# control instead of in dashboard fields.
#
# Requires two repository secrets, which are the only part of this setup that is
# NOT recoverable from git:
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  — the account the neon-strike Pages project lives in
name: deploy

on:
  push:
    branches: [main]
    # Skip the deploy when a push only touched dev-only files — nothing the live
    # site serves. This is the version-controlled replacement for the old
    # netlify.toml `ignore` command, and it stays a DENYLIST on purpose: any new
    # or unlisted
    # file (index.html, _headers, functions/**, lib/**) still deploys, which is
    # the safe default.
    paths-ignore:
      - 'CLAUDE.md'
      - 'PLAN.md'
      - 'README.md'
      - 'Makefile'
      - '.gitignore'
      # The playtest harness (item 58) is dev-only: `dist/` is staged by hand below
      # from index.html + _headers, so nothing under tools/ can reach the live site
      # even if this entry were missing. It is here so a harness-only change does not
      # spend a deploy.
      - 'tools/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # v5 is the release that moved this action to Node 24 (v4 targeted Node 20
      # and was being force-shimmed onto 24, which annotated every run). v7 is
      # current and safe here: v6 only changed where the git credentials are
      # persisted (nothing downstream reads them — the only git use is the
      # `git describe` below), and v7 only blocks checking out fork PRs for
      # `pull_request_target` / `workflow_run`, neither of which this workflow
      # triggers on. Floating on the major, as before, so patch fixes land free.
      - uses: actions/checkout@v7
        with:
          # The version badge (roadmap item 35) is stamped from `git describe
          # --tags` below, so the tags have to actually be here. Netlify's shallow
          # clone needed an explicit `git fetch --tags` for exactly this reason —
          # without it the badge silently degrades to a bare commit hash forever.
          fetch-depth: 0
          fetch-tags: true

      - name: Unit-test pure leaderboard logic
        # Explicit file, NOT `node --test lib/`: pointed at a directory, the test
        # runner exits 0 with "no tests found" if the file is missing or misnamed,
        # so this deploy gate would silently pass forever. Naming the file makes
        # that a hard error. Same command as `make test`.
        run: node --test lib/leaderboard-core.test.mjs

      - name: Stamp version + stage dist
        # dist/ holds exactly what the live site serves. Staging it (rather than
        # publishing the repo root) is what keeps CLAUDE.md, PLAN.md, README.md
        # and the Makefile off the live URL.
        #
        # Keep the sed pattern scoped to ">__VERSION__<" (the badge divs), NOT a
        # bare "__VERSION__" — a bare match also rewrites the JS placeholder
        # guard's own string literal (`el.textContent === '__VERSION__'`), which
        # then flips the freshly-stamped badge back to "dev" at page load. Commit
        # c8c7ce6 fixed exactly that; do not reintroduce it.
        run: |
          VER=$(git describe --tags --always --dirty)
          echo "stamping version: $VER"
          mkdir -p dist
          sed "s/>__VERSION__</>$VER</" index.html > dist/index.html
          cp _headers dist/

      # v4 is the Node 24 release (v3 targeted Node 20). Its ONLY other breaking
      # change is that the default wrangler version became v4/`latest` — a no-op
      # here, because wranglerVersion below is pinned explicitly and always was.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin wrangler. Left unset, the action installs its own baked-in default
          # (3.90.0, from Nov 2024) — not whatever is current, and not the version
          # this repo's `functions/` + wrangler.toml were verified against locally.
          # Bump this together with the compatibility_date in wrangler.toml.
          wranglerVersion: '4.115.0'
          # Runs from the repo root, so wrangler picks up wrangler.toml (the D1
          # binding the leaderboard Function reads as env.DB) and compiles the
          # root functions/ folder into Pages Functions. `dist` is only the static
          # half of the deploy.
          command: pages deploy dist --project-name=neon-strike
